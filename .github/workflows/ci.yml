# REQ-538/M345：最小 CI 门禁（自 90 号 E3 拆出与 E1 并线——外部 PR 出现前的裸奔窗口收口）。
# 触发：push main + PR；跑三平面 Go 测试 + web tsc/build。
# 边界：headless 冒烟不纳入（runner 成本——评估后决定，见 01 §3.17 REQ-538 行）。
# 2026-10-31 拆步：build/vet/test 各占一步——合并步失败时批注只给 exit code 不给命令名，
# 排障盲（ontology-service 连续两轮 red 无法归因到命令级，拆步后 annotation 直指步骤）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: backend build
        working-directory: backend
        run: go build ./...
      - name: backend vet
        working-directory: backend
        run: go vet ./internal/...
      - name: backend test
        working-directory: backend
        run: go test -count=1 ./internal/store/ ./internal/doccheck/ ./internal/api/ ./internal/chat/

  ontology-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: ontology-service build
        working-directory: ontology-service
        run: go build ./...
      - name: ontology-service vet
        working-directory: ontology-service
        run: go vet ./...
      - name: ontology-service test
        working-directory: ontology-service
        run: go test -count=1 ./...

  runtime-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: runtime-manager build
        working-directory: runtime-manager
        run: go build ./...
      - name: runtime-manager vet
        working-directory: runtime-manager
        run: go vet ./...
      - name: runtime-manager test
        working-directory: runtime-manager
        run: go test -count=1 ./...

  pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: pkg build
        working-directory: pkg/migrate
        run: go build ./...
      - name: pkg vet
        working-directory: pkg/migrate
        run: go vet ./...
      - name: pkg test
        working-directory: pkg/migrate
        run: go test -count=1 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: web install
        working-directory: web
        run: npm ci
      - name: web tsc
        working-directory: web
        run: npx tsc --noEmit
      - name: web build
        working-directory: web
        run: npm run build
