{{- range .Values.components }}
{{- if eq (.enabled | toString) "false" }}{{- continue }}{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ontoagents.name" (dict "Release" $.Release "component" .name) }}
  labels:
    {{- include "ontoagents.labels" (dict "Release" $.Release "component" .name) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ .name }}
  template:
    metadata:
      labels:
        {{- include "ontoagents.labels" (dict "Release" $.Release "component" .name) | nindent 8 }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ include "ontoagents.fullimage" (dict "image" .) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .port }}
          env:
            {{- range .env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "ontoagents.name" (dict "Release" $.Release "component" .name) }}
{{- end }}
