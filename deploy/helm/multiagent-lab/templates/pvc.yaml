{{- range .Values.components }}
{{- if eq (.enabled | toString) "false" }}{{- continue }}{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "multiagent-lab.name" (dict "Release" $.Release "component" .name) }}
  labels:
    {{- include "multiagent-lab.labels" (dict "Release" $.Release "component" .name) | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .storage }}
{{- end }}
