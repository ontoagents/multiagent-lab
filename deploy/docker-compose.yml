# multiagent-lab 服务器单机部署（Docker Compose）
# 用法：cd deploy && docker compose up -d --build
#       需要知识库向量检索：docker compose --profile qdrant up -d
# 文档：platform-knowledge/01_整体设计/16_部署与运行.md（REQ-518：指针自已退役的 docs/13 修正）
# 服务间编址契约表见 16 号 §3.0（REQ-518/M325——compose 与代码 getenv 对账单源）
name: multiagent-lab

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      # REQ-534/M341：默认仅回环可达（局域网部署显式改绑并设 PLATFORM_TOKEN——16 号 §3.1/§11）
      - "127.0.0.1:8080:8080"
    environment:
      # REQ-534/M341：局域网部署必设（docker compose 用 .env 或 export PLATFORM_TOKEN=...）
      # PLATFORM_TOKEN: ${PLATFORM_TOKEN:?局域网部署必设 PLATFORM_TOKEN（本机访问免凭证）}
      PLATFORM_TOKEN: ${PLATFORM_TOKEN:-}
      BUILD_SVC_URL: http://ontology-service:8091
      RUNTIME_MGR_URL: http://runtime-manager:8090
      # REQ-518/M325：显式补齐（代码侧已支持缺省自 RUNTIME_MGR_URL 派生 /mcp——双保险）
      ONTOLOGY_MCP_URL: http://runtime-manager:8090/mcp
      # Docker 沙箱（进阶，默认关）：需挂载 /var/run/docker.sock 并改写回连地址
      # SANDBOX_IMAGE: multiagent-lab/agentd:latest
      # PLATFORM_URL_EXTERNAL: http://<宿主IP>:8080
    volumes:
      - platform-data:/app/data
    depends_on:
      - ontology-service
      - runtime-manager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  ontology-service:
    build:
      context: ..
      dockerfile: ontology-service/Dockerfile
    environment:
      PLATFORM_URL: http://backend:8080
      ADDR: ":8091" # REQ-383：容器网络内互通需绑全接口（宿主机直跑默认 127.0.0.1）
    volumes:
      - ontology-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  runtime-manager:
    build:
      context: ..
      dockerfile: runtime-manager/Dockerfile
    environment:
      BUILD_SVC_URL: http://ontology-service:8091
      # REQ-518/M325：sparql_query 的 graph=companion 查询归属解析依赖此编址——
      # 缺省时 OWNER_RESOLVE_FAILED（宿主直跑默认 127.0.0.1:8080 宿主机可用，容器内必败）
      PLATFORM_API_URL: http://backend:8080
      ADDR: ":8090" # REQ-383：同上
    volumes:
      - runtime-data:/app/data
      - runtime-logs:/app/logs
    # oxigraph 子进程端口（9201+）仅容器内可达；对话/本体查询经 manager 内部转发，功能完整
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "127.0.0.1:6333:6333" # REQ-534/M341：回环绑定同口径
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  platform-data:
  ontology-data:
  runtime-data:
  runtime-logs:
  qdrant-data:
