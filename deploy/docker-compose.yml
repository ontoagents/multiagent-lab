# multiagent-lab 服务器单机部署（Docker Compose）
# 用法：cd deploy && docker compose up -d --build
#       需要知识库向量检索：docker compose --profile qdrant up -d
# 文档：docs/13_部署与运行.md
name: multiagent-lab

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      BUILD_SVC_URL: http://ontology-service:8091
      RUNTIME_MGR_URL: http://runtime-manager:8090
      SEMANTICA_WORKER_URL: http://semantica-worker:8093
      # Docker 沙箱（进阶，默认关）：需挂载 /var/run/docker.sock 并改写回连地址
      # SANDBOX_IMAGE: multiagent-lab/agentd:latest
      # PLATFORM_URL_EXTERNAL: http://<宿主IP>:8080
    volumes:
      - platform-data:/app/data
    depends_on:
      - ontology-service
      - runtime-manager
      - semantica-worker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  semantica-worker:
    build:
      context: ..
      dockerfile: tools/semantica-worker/Dockerfile
    # ⚠️ 镜像 6~10 GB（semantica 0.6.8 重依赖），构建耗时较长——见 docs/13 §9 痛点待办
    volumes:
      - semantica-data:/app/data
    # 前端经 backend 反代 /api/semantica/* 访问；如需直连调试可放开端口
    # ports: ["8093:8093"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8093/health',timeout=4)"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

  ontology-service:
    build:
      context: ..
      dockerfile: ontology-service/Dockerfile
    environment:
      PLATFORM_URL: http://backend:8080
      ADDR: ":8091" # REQ-383：容器网络内互通需绑全接口（宿主机直跑默认 127.0.0.1）
    volumes:
      - ontology-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8091/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  runtime-manager:
    build:
      context: ..
      dockerfile: runtime-manager/Dockerfile
    environment:
      BUILD_SVC_URL: http://ontology-service:8091
      ADDR: ":8090" # REQ-383：同上
    volumes:
      - runtime-data:/app/data
      - runtime-logs:/app/logs
    # oxigraph 子进程端口（9201+）仅容器内可达；对话/本体查询经 manager 内部转发，功能完整
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  platform-data:
  ontology-data:
  runtime-data:
  runtime-logs:
  semantica-data:
  qdrant-data:
