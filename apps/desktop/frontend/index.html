<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>智能体构建平台</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; height: 100%;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #f7f8fa; color: #374151;
    -webkit-user-select: none; user-select: none;
  }
  .spin {
    width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid #e5e7eb; border-top-color: #4f46e5;
    animation: mlab-spin 0.9s linear infinite;
  }
  @keyframes mlab-spin { to { transform: rotate(360deg); } }
  .t1 { font-size: 15px; font-weight: 600; color: #1f2937; }
  .t2 { font-size: 12px; color: #9ca3af; }
</style>
</head>
<body>
  <div class="spin"></div>
  <div class="t1">正在启动智能体构建平台…</div>
  <div class="t2">正在拉起本地服务，通常只需数秒</div>
  <!-- 启动过渡页（frontendDist 占位即正式过渡页）：窗口首帧渲染完成即显示（lib.rs on_page_load），
       服务就绪后由 Rust 侧 location.replace 到本实例 backend 实际地址（端口被占自动顺延）。 -->
</body>
</html>
